# tmux config

# set resize pane to hjkl
bind -n C-k resize-pane -U 5
bind -n C-j resize-pane -D 5
bind -n C-h resize-pane -L 5
bind -n C-l resize-pane -R 5


# terminal
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm-256color:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ',xterm*:sitm=\E[3m'


# misc
set -g history-limit 1000000     # increase history size (from 2,000)
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1         # start indexing panes at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g renumber-windows on       # renumber all windows when any window is closed
set -g escape-time 0             # zero-out escape time delay
set -g set-clipboard on          # use system set-clipboard
set -g allow-passthrough all
set -g display-panes-time 3000   # show pane numbers longer after prefix q
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_PROGRAM_VERSION
set -g mode-keys vi
set -g status-position top       # macOS / darwin style


# copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


# panes
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
bind C-y setw synchronize-panes


# custom pane layout functionality
# C-a C-t → 1 pane with original content
bind C-t \
  kill-pane -a
# C-a C-q → 3 panes 33/33/33 with original content in the CENTER
bind C-q \
  kill-pane -a \; \
  split-window -h \; \
  split-window -h \; \
  swap-pane -s 1 -t 2 \; \
  select-layout even-horizontal \; \
  select-pane -t 2
# C-a C-w → 3 panes 25/50/25 with original content in the CENTER
bind C-w \
  kill-pane -a \; \
  split-window -h \; \
  split-window -h \; \
  swap-pane -s 1 -t 2 \; \
  resize-pane -t 1 -x 25% \; \
  resize-pane -t 3 -x 25% \; \
  select-pane -t 2
# C-a C-f → 3 panes 15/70/15 with original content in the CENTER
bind C-f \
  kill-pane -a \; \
  split-window -h \; \
  split-window -h \; \
  swap-pane -s 1 -t 2 \; \
  resize-pane -t 1 -x 15% \; \
  resize-pane -t 3 -x 15% \; \
  select-pane -t 2
# C-a C-p → 2 panes 50/50 with original content on the left
bind C-p \
  kill-pane -a \; \
  split-window -h \; \
  resize-pane -t 1 -x 50% \; \
  select-pane -t 1
# C-a C-g → 2 panes 65/35 with original content on the left
bind C-g \
  kill-pane -a \; \
  split-window -h \; \
  resize-pane -t 1 -x 65% \; \
  select-pane -t 1


# load plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sschmerda/tmux-dux'

# tmux-dux
set -g @tmux-dux-key 'Space'


# tmux-which-key
bind-key C-Space show-wk-menu-root


# session x
set -g @sessionx-x-path "$HOME/.config"
set -g @sessionx-custom-paths "$HOME/stefan/code/temp/,\
                               $HOME/stefan/code/repos/,\
                               $HOME/stefan/code/work_repos/,\
                               $HOME/stefan/code/local/,\
                               $HOME/stefan/documents/,"
set -g @sessionx-bind 'h'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
# set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'true'
set -g @sessionx-filter-current 'false'
# set -g @sessionx-fzf-builtin-tmux 'on'


# run package manager
run '~/.tmux/plugins/tpm/tpm'


# shades of purple status bar overrides
set -g status 2
set -g status-interval 15
set -g status-justify "absolute-centre"
set -g status-style 'fg=#8f89aa,bg=#3d2b70'
set -g status-left-length 80
set -g status-left '#[fg=#{?client_prefix,#ff5c57,#fad000},bg=#9a80ee]  #[fg=#{?pane_synchronized,#ff5c57,#fad000},bg=#9a80ee] 󰓦 #[fg=#fad000,bg=#5f4a98] #S '
set -g status-right-length 160
set -g status-right '#[fg=#fad000,bg=#9a80ee] 󰃰 #[fg=#fad000,bg=#5f4a98] %a %d %b %H:%M '
set -g window-status-separator '#[fg=#725abd,bg=#3d2b70] │ '
set -g window-status-style 'fg=#8f89aa,bg=#3d2b70'
set -g window-status-current-style 'fg=#fad000,bg=#3d2b70,bold'
set -g window-status-format '#[fg=#b1a8dc,bg=#5f4a98] #I #[fg=#8379a6,bg=#3d2b70] #W '
set -g window-status-current-format '#[fg=#fad000,bg=#9a80ee,bold] #I #[fg=#fad000,bg=#3d2b70,bold] #W#{?window_zoomed_flag, ,} '
setw -g pane-active-border-style 'fg=#fad000,bg=default'
setw -g pane-border-style 'fg=#fad000,bg=default'
set -g status-format[1] '#[fg=#3d2b70,bg=#3d2b70]  #[fg=#fad000,bg=#3d2b70]#(width=#{client_width}; count=$((width - 4)); awk -v n="$count" "BEGIN { for (i = 0; i < n; i++) printf \"─\" }")#[fg=#3d2b70,bg=#3d2b70]  '
